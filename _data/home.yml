role: Signal Processing Engineer · Ph.D. Student
headline: Radar signal processing for understanding our changing environment.
summary: I develop passive remote sensing systems and signal processing methods to study geophysical environments, drawing on radar engineering, field testing, and deep learning.
focus:
  - SDR-based ground GNSS passive remote sensing
  - Geophysical parameter estimation for rock faces and icebergs in Greenland fjords
  - Radar signal processing and field measurement systems
