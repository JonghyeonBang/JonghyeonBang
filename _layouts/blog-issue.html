---
layout: profile
---
<article><h1>{{ page.title }}</h1><p>{{ page.date | date: '%B %-d, %Y' }}</p>{{ content }}
{% if page.pdf %}<p><a href="{{ page.pdf | relative_url }}">Read or download PDF</a></p><iframe title="{{ page.title | escape }} PDF reader" src="{{ page.pdf | relative_url }}" width="100%" height="800"></iframe>{% elsif page.spreads %}
<div class="issue-reader">{% for spread in page.spreads %}<figure class="issue-spread"{% unless forloop.first %} hidden{% endunless %}><img src="{{ spread.image | relative_url }}" alt="{{ spread.alt | escape }}">{% if spread.caption %}<figcaption>{{ spread.caption }}</figcaption>{% endif %}</figure>{% endfor %}<div class="profile-actions"><button class="btn" type="button" data-previous disabled>Previous</button><span aria-live="polite" data-position>1 / {{ page.spreads.size }}</span><button class="btn" type="button" data-next>Next</button></div></div>
<script src="{{ '/assets/js/issue-reader.js' | relative_url }}" defer></script>{% endif %}</article>
